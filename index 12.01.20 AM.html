<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>John T. Lovato Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <!-- Header & Logo -->
    <header class="header">
      <div class="container">
        <img src="./images/angel.webp" class="angel-left" alt="Angel Left" />
        <img src="./images/logo.webp" class="logo" alt="Logo" />
        <img src="./images/angel.webp" class="angel-right" alt="Angel Right" />
      </div>
    </header>

    <!-- Main Navigation Section -->
    <main class="main-content container">
      <div class="category-grid">
        <button class="category-btn sports-btn" data-category="Sports"></button>
        <button class="category-btn ai-btn" data-category="AI"></button>
        <button class="category-btn logos-btn" data-category="Logos"></button>
      </div>

      <button class="about-btn" data-category="About">
        <img
          class="moi-angel"
          src="./images/aboutangel.webp"
          alt="About Section"
        />
      </button>
    </main>

    <!-- MODAL / LIGHTBOX Structure -->
    <div id="modal" class="modal-overlay">
      <div class="modal-content-wrapper">
        <!-- Scrollable inner content; X stays fixed in wrapper -->
        <div id="modal-content" class="modal-inner-content">
          <div class="modal-title-holder">
            <div class="back-btn-holder">
              <!-- Back button (for Sports sub-galleries) -->
              <button id="back-to-sports" class="back-btn hidden">
                <img src="./images/back.webp" class="back-btn-img" alt="Back" />
              </button>
            </div>

            <h2 id="modal-title" class="modal-title"></h2>

            <div class="back-btn-holder">
              <!-- Close button image (paired with back button) -->
              <button id="close-with-back" class="back-btn hidden">
                <img
                  src="./images/close.webp"
                  class="back-btn-img"
                  alt="Close"
                />
              </button>
            </div>
          </div>
          <div class="blurb-holder">
            <p id="modal-blurb" class="modal-blurb"></p>
          </div>

          <!-- 1. NAVIGATION VIEW (For Sports) -->
          <div id="navigation-view" class="navigation-view hidden">
            <button
              class="subcategory-btn"
              data-category="Avalanche"
              aria-label="Avalanche"
            >
              <img
                src="./images/avs_link.webp"
                data-desktop-src="./images/avs_link.webp"
                data-mobile-src="./images/avs_link_mobile.webp"
                alt="Avalanche"
                class="subcategory-img"
              />
            </button>

            <button
              class="subcategory-btn"
              data-category="General"
              aria-label="General sports"
            >
              <img
                src="./images/misc_link.webp"
                data-desktop-src="./images/misc_link.webp"
                data-mobile-src="./images/misc_link_mobile.webp"
                alt="General Sports"
                class="subcategory-img"
              />
            </button>

            <button
              class="subcategory-btn"
              data-category="Islanders"
              aria-label="Islanders"
            >
              <img
                src="./images/isles_link.webp"
                data-desktop-src="./images/isles_link.webp"
                data-mobile-src="./images/isles_link_mobile.webp"
                alt="Islanders"
                class="subcategory-img"
              />
            </button>
          </div>

          <!-- Back button for Sports sub-galleries -->

          <!-- 2. GALLERY VIEW (For AI, Logos, Sports teams) -->
          <div id="gallery-view" class="gallery-view hidden">
            <div class="slideshow-container">
              <img
                id="modal-image"
                class="modal-image"
                src=""
                alt="Portfolio Image"
              />
              <a class="nav-btn prev-btn">❮</a>
              <a class="nav-btn next-btn">❯</a>
            </div>
            <div id="modal-caption" class="modal-caption"></div>
          </div>

          <!-- 3. ABOUT VIEW -->
          <div id="about-view" class="about-view hidden"></div>
        </div>
      </div>
    </div>

    <!-- Link External JavaScript -->
    <script src="scripts.js"></script>
  </body>
</html>
