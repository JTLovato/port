<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>John T. Lovato Portfolio</title>

    <!-- SEO / Open Graph (Social Media) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aialtlab.org/" />
    <meta
      property="og:title"
      content="John T. Lovato | Graphic Design Portfolio"
    />
    <meta
      property="og:description"
      content="Graphic designer specializing in impactful sports design and AI-driven visual storytelling."
    />
    <meta property="og:image" content="https://i.imgur.com/XeQEIrS.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Google Site Verification -->
    <meta
      name="google-site-verification"
      content="xlxoKu33Pb3yaQari_mfBBBdk1M3UPoa01vNPX_1o3Q"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Favicon & Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XG2GB638ET"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-XG2GB638ET");
    </script>

    <!-- Schema.org / JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "http://schema.org",
        "@type": "Person",
        "name": "John T. Lovato",
        "jobTitle": "Graphic Designer",
        "url": "https://johntlovato.com/",
        "description": "Specializing in sports design and AI visual concepts."
      }
    </script>
  </head>
  <body>
    <!-- Header / Navigation Section -->
    <header class="portfolio-header">
      <div class="logo-container">
        <h1>John T. Lovato</h1>
        <p>Graphic Design & Visual Strategy</p>
      </div>
      <nav class="main-nav">
        <button data-category="About">About</button>
        <button data-category="Logos">Logos</button>
        <button data-category="AI">AI Concepts</button>
        <button data-category="Sports">Sports</button>
      </nav>
    </header>

    <!-- Main Portfolio Grid / Landing -->
    <main class="portfolio-container">
      <div class="category-grid">
        <!-- AI Category -->
        <div class="category-card" data-category="AI">
          <img
            src="images/ai_sign.webp"
            alt="AI Concepts"
            class="subcategory-img"
            data-desktop-src="images/aisign.webp"
            data-mobile-src="images/ai_sign.webp"
          />
          <div class="card-overlay">
            <h3>AI Concepts</h3>
          </div>
        </div>
        <!-- Logo Category -->
        <div class="category-card" data-category="Logos">
          <img
            src="images/logo_sign.webp"
            alt="Logo Design"
            class="subcategory-img"
            data-desktop-src="images/logo_sign.webp"
            data-mobile-src="images/logo_sign.webp"
          />
          <div class="card-overlay">
            <h3>Logo Design</h3>
          </div>
        </div>
        <!-- Sports Category -->
        <div class="category-card" data-category="Sports">
          <img
            src="images/sports_sign.webp"
            alt="Sports Design"
            class="subcategory-img"
            data-desktop-src="images/sports_sign.webp"
            data-mobile-src="images/sports_sign.webp"
          />
          <div class="card-overlay">
            <h3>Sports Portfolio</h3>
          </div>
        </div>
      </div>
    </main>

    <!-- Unified Modal for Galleries & Content -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <!-- Close Controls -->
        <div class="modal-controls">
          <button id="back-to-sports" class="hidden">← Back to Sports</button>
          <button id="close-with-back" class="close-btn">×</button>
        </div>

        <h2 id="modal-title"></h2>
        <p id="modal-blurb"></p>

        <!-- Dynamic Views -->
        <div id="about-view" class="hidden"></div>

        <div id="navigation-view" class="hidden">
          <div class="sports-subcategories">
            <button data-category="Avalanche">Colorado Avalanche</button>
            <button data-category="Islanders">NY Islanders</button>
            <button data-category="General">General Sports</button>
          </div>
        </div>

        <div id="gallery-view" class="hidden">
          <div class="slideshow-container">
            <img id="modal-image" src="" alt="" />
            <div id="modal-caption" class="modal-caption"></div>
          </div>
          <button class="prev-btn">❮</button>
          <button class="next-btn">❯</button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="scripts.js"></script>
  </body>
</html>
