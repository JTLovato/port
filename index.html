<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>John T. Lovato Portfolio</title>

    <!-- Meta Description for SEO -->
    <meta
      name="description"
      content="Explore the portfolio of John T. Lovato, a graphic designer specializing in high-impact sports design, visual identity, and innovative AI-driven creative concepts."
    />

    <!-- SEO / Open Graph (Social Media) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aialtlab.org/" />
    <meta
      property="og:title"
      content="John T. Lovato | Graphic Design Portfolio"
    />
    <meta
      property="og:description"
      content="Graphic designer specializing in impactful sports design and AI-driven visual storytelling."
    />
    <meta property="og:image" content="https://i.imgur.com/XeQEIrS.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="John T. Lovato | Portfolio" />
    <meta
      name="twitter:description"
      content="Expert sports design and AI visual identity concepts."
    />
    <meta name="twitter:image" content="https://i.imgur.com/XeQEIrS.jpeg" />

    <!-- Google Site Verification -->
    <meta
      name="google-site-verification"
      content="xlxoKu33Pb3yaQari_mfBBBdk1M3UPoa01vNPX_1o3Q"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicon_io/apple-touch-icon.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Story+Script&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="./favicon_io/site.webmanifest" />
  </head>
  <body>
    <!-- Header & Logo -->
    <header class="header">
      <div class="container">
        <img
          src="./images/angel.webp"
          class="angel-left"
          alt="Decorative Angel Left"
        />
        <img src="./images/logo.webp" class="logo" alt="John T. Lovato Logo" />
        <img
          src="./images/angel.webp"
          class="angel-right"
          alt="Decorative Angel Right"
        />
      </div>
    </header>

    <!-- Main Navigation Section -->
    <main class="main-content container">
      <div class="category-grid">
        <a
          href="#sports"
          class="category-btn sports-btn"
          data-category="Sports"
          aria-label="Open Sports Concepts Gallery"
        ></a>
        <a
          href="#ai"
          class="category-btn ai-btn"
          data-category="AI"
          aria-label="Open AI Concepts Gallery"
        ></a>
        <a
          href="#logos"
          class="category-btn logos-btn"
          data-category="Logos"
          aria-label="Open Logos Concepts Gallery"
        ></a>
      </div>

      <a
        href="#about"
        class="about-btn"
        data-category="About"
        aria-label="Learn More About John"
      >
        <img
          class="moi-angel"
          src="./images/aboutangel.webp"
          alt="John T. Lovato About Section"
        />
      </a>
    </main>

    <!-- MODAL / LIGHTBOX Structure -->
    <div
      id="modal"
      class="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-content-wrapper">
        <!-- Scrollable inner content; Navigation elements stay fixed in the holder -->
        <div id="modal-content" class="modal-inner-content">
          <div class="modal-title-holder">
            <div class="back-btn-holder">
              <!-- Back button (for Sports sub-galleries) -->
              <button
                id="back-to-sports"
                class="back-btn hidden"
                aria-label="Back To Sports Categories"
              >
                <img
                  src="./images/back.webp"
                  class="back-btn-img"
                  alt="Back Icon"
                />
              </button>
            </div>

            <h2 id="modal-title" class="modal-title"></h2>

            <div class="back-btn-holder">
              <!-- Close button image - Ensure this is toggled in JS for 'About' type -->
              <button
                id="close-with-back"
                class="back-btn hidden"
                aria-label="Close Portfolio Section"
              >
                <img
                  src="./images/close.webp"
                  class="back-btn-img"
                  alt="Close Icon"
                />
              </button>
            </div>
          </div>
          <div class="blurb-holder">
            <p id="modal-blurb" class="modal-blurb"></p>
          </div>

          <!-- 1. NAVIGATION VIEW (For Sports) -->
          <nav id="navigation-view" class="navigation-view hidden">
            <a
              href="#avalanche"
              class="subcategory-btn"
              data-category="Avalanche"
              aria-label="View Avalanche Designs"
            >
              <img
                src="./images/avs_link.webp"
                data-desktop-src="./images/avs_link.webp"
                data-mobile-src="./images/avs_link_mobile.webp"
                alt="Colorado Avalanche Portfolio"
                class="subcategory-img"
              />
            </a>

            <a
              href="#general"
              class="subcategory-btn"
              data-category="General"
              aria-label="View General Sports Designs"
            >
              <img
                src="./images/misc_link.webp"
                data-desktop-src="./images/misc_link.webp"
                data-mobile-src="./images/misc_link_mobile.webp"
                alt="General Sports Portfolio"
                class="subcategory-img"
              />
            </a>

            <a
              href="#islanders"
              class="subcategory-btn"
              data-category="Islanders"
              aria-label="View Islanders Designs"
            >
              <img
                src="./images/isles_link.webp"
                data-desktop-src="./images/isles_link.webp"
                data-mobile-src="./images/isles_link_mobile.webp"
                alt="New York Islanders Portfolio"
                class="subcategory-img"
              />
            </a>
          </nav>

          <!-- 2. GALLERY VIEW (For AI, Logos, Sports teams) -->
          <div id="gallery-view" class="gallery-view hidden">
            <div class="slideshow-container">
              <img
                id="modal-image"
                class="modal-image"
                src=""
                alt="Portfolio Gallery Content"
              />
              <button class="nav-btn prev-btn" aria-label="Previous image">
                ❮
              </button>
              <button class="nav-btn next-btn" aria-label="Next image">
                ❯
              </button>
            </div>
            <div id="modal-caption" class="modal-caption"></div>
          </div>

          <!-- 3. ABOUT VIEW -->
          <div id="about-view" class="about-view hidden"></div>
        </div>
      </div>
    </div>

    <!-- Link External JavaScript -->
    <script src="scripts.js"></script>
  </body>
</html>
